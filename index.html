<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Oxford3000 RPG</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;
    padding:40px;
}

.title{
    font-size:40px;
    color:#ff4d6d;
}

.dialogue-box{
    margin-top:30px;
    background:#222;
    border:2px solid #444;
    border-radius:15px;
    padding:25px;
}

.character{
    color:#ff4d6d;
    font-size:28px;
    font-weight:bold;
}

.vocab{
    color:#00d4ff;
    font-weight:bold;
}

textarea{
    width:100%;
    height:120px;
    margin-top:20px;
    background:#1a1a1a;
    color:white;
    border:1px solid #666;
    border-radius:10px;
    padding:15px;
    font-size:18px;
}

button{
    margin-top:20px;
    padding:15px 30px;
    background:#ff4d6d;
    border:none;
    border-radius:10px;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#ff6b81;
}

.chat-box{
    margin-top:30px;
}

.message{
    background:#1a1a1a;
    border:1px solid #444;
    border-radius:10px;
    padding:20px;
    margin-top:15px;
}

.you{
    color:#00d4ff;
    font-weight:bold;
}

.ada{
    color:#ff4d6d;
    font-weight:bold;
}

</style>

</head>

<body>

<div class="title">
Oxford3000 RPG
</div>

<div class="dialogue-box">

<div class="character">
Ada Wong
</div>

<p>
The supplier postponed the
<span class="vocab">shipment</span>
again.
</p>

<p>
If we miss the
<span class="vocab">deadline</span>,
the client may terminate the project.
</p>

<p>
Do you have an
<span class="vocab">alternative</span>
plan?
</p>

</div>

<textarea id="playerInput" placeholder="Type your response here..."></textarea>

<button onclick="sendResponse()">
Send Response
</button>

<div id="chatLog" class="chat-box"></div>

<script>

function sendResponse(){

    let response =
    document.getElementById("playerInput").value;

    document.getElementById("chatLog").innerHTML += `

    <div class="message">

        <div class="you">
        You
        </div>

        <p>${response}</p>

        <div class="ada">
        Ada Wong
        </div>

        <p>
        I understand. We need to act before the deadline.
        </p>
        <div class="ada">
Jill Valentine
</div>

<p>
We also need a backup supplier in case of another delay.
</p>

    </div>

    `;

    document.getElementById("playerInput").value = "";

}

</script>

</body>

</html>
