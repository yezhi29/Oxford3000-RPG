<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Oxford3000 RPG</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    padding:40px;
}

.title{
    font-size:40px;
    color:#ff4d6d;
}

.dialogue-box{
    margin-top:30px;
    background:#222;
    border:2px solid #444;
    border-radius:15px;
    padding:25px;
}

.character{
    color:#ff4d6d;
    font-size:28px;
    font-weight:bold;
}

.vocab{
    color:#00d4ff;
    font-weight:bold;
}

textarea{
    width:100%;
    height:120px;
    margin-top:20px;
    background:#1a1a1a;
    color:white;
    border:1px solid #666;
    border-radius:10px;
    padding:15px;
    font-size:18px;
}

button{
    margin-top:20px;
    padding:15px 30px;
    background:#ff4d6d;
    border:none;
    border-radius:10px;
    color:white;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#ff6b81;
}

.chat-box{
    margin-top:30px;
}

.message{
    background:#1a1a1a;
    border:1px solid #444;
    border-radius:10px;
    padding:20px;
    margin-top:15px;
}

.you{
    color:#00d4ff;
    font-weight:bold;
}

.ada{
    color:#ff4d6d;
    font-weight:bold;
}

.word-panel{
    margin-top:20px;
    background:#1a1a1a;
    border:1px solid #555;
    border-radius:15px;
    padding:20px;
}

.word-panel h2{
    color:#00d4ff;
}

.word-panel li{
    margin:8px 0;
    font-size:18px;
}
</style>
</head>

<body>

<div class="title">
Oxford3000 RPG
</div>

<div class="word-panel">
    <h2>Today's Oxford3000 Target Words</h2>
    <ul id="wordList">
        <li>Loading words...</li>
    </ul>
</div>

<div class="dialogue-box">

<div class="character">
Ada Wong
</div>

<p>
The supplier postponed the
<span class="vocab">shipment</span>
again.
</p>

<p>
If we miss the
<span class="vocab">deadline</span>,
the client may terminate the project.
</p>

<p>
Do you have an
<span class="vocab">alternative</span>
plan?
</p>

</div>

<textarea id="playerInput" placeholder="Type your response here..."></textarea>

<button onclick="sendResponse()">
Send Response
</button>

<div id="chatLog" class="chat-box"></div>

<script>
async function loadWords(){

    try{
        const response = await fetch("vocabulary/oxford3000.csv");
        const text = await response.text();

        const lines = text.split("\n").slice(1);

        const words = lines
            .map(line => line.split(",")[0])
            .filter(word => word && word.length > 2);

        const selected = words
            .sort(() => Math.random() - 0.5)
            .slice(0, 5);

        document.getElementById("wordList").innerHTML =
            selected.map(word => `<li>${word}</li>`).join("");

    } catch(error){
        document.getElementById("wordList").innerHTML =
            "<li>Could not load oxford3000.csv</li>";

        console.error(error);
    }
}

function sendResponse(){

    let response = document.getElementById("playerInput").value;

    document.getElementById("chatLog").innerHTML += `

    <div class="message">

        <div class="you">
        You
        </div>

        <p>${response}</p>

        <div class="ada">
        Ada Wong
        </div>

        <p>
        I understand. We need to act before the deadline.
        Try to use today's target words in your answer.
        </p>

    </div>

    `;

    document.getElementById("playerInput").value = "";
}

loadWords();
</script>

</body>
</html>
